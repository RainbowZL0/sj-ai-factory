[project]
name = "sj-rl-factory-schedule"
version = "0.1.0"
description = "A factory simulator, and an AI that learns by trial and error which machines should make what."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.1.0",
    "gymnasium[classic-control]>=1.1.1",
    "matplotlib>=3.10.3",
    "networkx>=3.4.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "plotly>=7.1.0",
    "ruamel-yaml>=0.18.10",
    "sb3-contrib>=2.6.0",
    "tensorboard>=2.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
