# Variant of lab.yaml: one more smelter and one more constructor, so the assemblers are the only tight kind
# (the orders need 86% of their time, and about 65% of the others'). Does spare time upstream help?
base: lab.yaml

machines:
  - {category: Smelter, recipe: Smelt_Iron, count: 2}
  - {category: Smelter, recipe: Smelt_Copper, count: 2}
  - {category: Constructor, recipe: Make_Plate, count: 2}
  - {category: Constructor, recipe: Make_Wire, count: 2}
  - {category: Assembler, recipe: Make_Frame, count: 2}
  - {category: Assembler, recipe: Make_Motor, count: 1}
