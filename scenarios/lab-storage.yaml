# Variant of lab.yaml: stock costs money to hold, so parts made too early or never used now cost profit.
# Holding 100 plates for the whole hour costs 7,200, about 12 Motors.
base: lab.yaml

materials:
  Iron: {storage_cost: 0.01}
  Copper: {storage_cost: 0.01}
  Plate: {storage_cost: 0.02}
  Wire: {storage_cost: 0.02}
  Motor: {storage_cost: 0.05}
  Frame: {storage_cost: 0.05}
